<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="14" fill="#0A0D12"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#303846" stroke-width="2"/>

  <!-- Sparks -->
  <rect x="24" y="8" width="4" height="4" rx="1" fill="#8B5CF6"/>
  <rect x="32" y="6" width="5" height="5" rx="1" fill="#C6FF4D"/>
  <rect x="42" y="10" width="4" height="4" rx="1" fill="#C6FF4D" opacity="0.9"/>
  <rect x="18" y="13" width="3" height="3" rx="0.5" fill="#8B5CF6" opacity="0.8"/>
  <rect x="29" y="14" width="4" height="4" rx="1" fill="#FFFFFF"/>

  <!-- Anvil Top Surface & Horn -->
  <rect x="14" y="22" width="38" height="7" rx="1.5" fill="#C6FF4D"/>
  <polygon points="14,22 8,25 14,29" fill="#C6FF4D"/>

  <!-- Anvil Midsection / Waist -->
  <rect x="23" y="29" width="20" height="6" fill="#A8E836"/>
  <rect x="25" y="35" width="16" height="5" fill="#8B5CF6"/>
  <rect x="31" y="32" width="4" height="4" rx="1" fill="#FFFFFF"/>

  <!-- Anvil Base / Pedestal -->
  <rect x="21" y="40" width="24" height="4" fill="#C6FF4D"/>
  <rect x="13" y="44" width="40" height="7" rx="1.5" fill="#C6FF4D"/>
</svg>

