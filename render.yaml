services:
  # -------------------------------------------------------------
  # Frontend: PIXELFORGE Portfolio Static Site
  # -------------------------------------------------------------
  - type: web
    name: pixelforge-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # -------------------------------------------------------------
  # Backend: PIXELFORGE REST API Service
  # -------------------------------------------------------------
  - type: web
    name: pixelforge-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
